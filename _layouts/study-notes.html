<html data-theme="emerald">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    {% feed_meta %}
    {% seo %}
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0-beta.1/daisyui.css" rel="stylesheet" type="text/css" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script src="https://cdn.tailwindcss.com"></script>
        <script>
          tailwind.config = {
            darkMode: ['selector', '[data-theme="dark"]'],
          }
        </script>
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/color-scheme.js" data-website-url="{{ site.url }}" async></script>
    <title>Study Notes</title>
    <link href="https://fonts.cdnfonts.com/css/dion" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/study-notes.css">
    
    <script src="{{ '/js/theme-switcher.js' | relative_url }}" defer></script>
    
  </head>
  <body>
    <nav>
      <!-- class="container mx-auto px-4 md:container md:mx-auto" -->
      <section>
        {% include navbar.html %}
      </section>
    </nav>
    
<main class="sheet">

    {{ content }}

    
  <footer>Tip: use your browser’s Print option and select “Save as PDF” for an A4 copy.</footer>
  <script>
  const tagFilter = document.getElementById('note-tag-filter');
  const keyStageFilter = document.getElementById('note-key-stage-filter');
  const noMatchingNotes = document.getElementById('no-matching-notes');
  const notes = Array.from(document.querySelectorAll('.note'));
  const sections = Array.from(document.querySelectorAll('.section-title'));
  const tags = [...new Set(notes.flatMap(note =>
    Array.from(note.querySelectorAll('.tag:not(.key-stage)'), tag => tag.textContent.trim())
  ))].filter(Boolean).sort();

  tags.forEach(tag => {
    const option = document.createElement('option');
    option.value = tag;
    option.textContent = tag;
    tagFilter.appendChild(option);
  });

  function filterNotesByTag() {
    notes.forEach(note => {
      const matchesTag = tagFilter.value === '' || Array.from(note.querySelectorAll('.tag:not(.key-stage)'))
        .some(tag => tag.textContent.trim() === tagFilter.value);
      const matchesKeyStage = keyStageFilter.value === '' || Array.from(note.querySelectorAll('.key-stage'))
        .some(stage => stage.textContent.trim() === keyStageFilter.value);
      note.hidden = !matchesTag || !matchesKeyStage;
    });

    noMatchingNotes.hidden = notes.some(note => !note.hidden);

    sections.forEach(section => {
      const grid = section.nextElementSibling;
      const hasVisibleNotes = Array.from(grid.querySelectorAll('.note')).some(note => !note.hidden);
      section.hidden = !hasVisibleNotes;
      grid.hidden = !hasVisibleNotes;
    });
  }

  tagFilter.addEventListener('change', filterNotesByTag);
  keyStageFilter.addEventListener('change', filterNotesByTag);
  tagFilter.parentElement.hidden = false;
</script>
</main>
</body>
</html>
